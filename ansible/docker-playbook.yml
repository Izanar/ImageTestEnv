---
- name: Run the application in Docker
  hosts: webservers
  become: true
  vars:
    app_repo_url: "{{ app_repo_url | default('https://github.com/Izanar/AI_Nginx.git') }}"
    app_cache_dir: /tmp/ai-nginx
    container_name: weather-app
    container_image: nginx:1.27-alpine

  tasks:
    - name: Install Docker and required packages
      apt:
        name:
          - docker.io
          - curl
          - ca-certificates
          - git
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      service:
        name: docker
        state: started
        enabled: true

    - name: Clone application source
      git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_cache_dir }}"
        clone: true
        update: true
        depth: 1

    - name: Remove previous application container
      command: "docker rm -f {{ container_name }}"
      register: removed_container
      failed_when: false
      changed_when: removed_container.rc == 0

    - name: Start application container
      command: >-
        docker run -d
        --name {{ container_name }}
        --restart unless-stopped
        -p 80:80
        -v {{ app_cache_dir }}/html:/usr/share/nginx/html:ro
        {{ container_image }}

    - name: Validate application container is serving content
      uri:
        url: "http://127.0.0.1"
        return_content: true
        timeout: 30
      register: app_check

    - name: Fail if the page is empty
      fail:
        msg: "Application container homepage is empty or unavailable"
      when: app_check.status is not defined or app_check.status != 200 or 'html' not in (app_check.content | default('') | lower)