---
- name: Deploy the EKS application
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubernetes_dir: "{{ playbook_dir }}/../kubernetes"
    audio_sync_script: "{{ playbook_dir }}/../scripts/sync-audio-to-s3.sh"
    app_repo_url: "https://github.com/Izanar/AI_Nginx.git"
    audio_bucket_name: "{{ lookup('env', 'AUDIO_BUCKET_NAME') }}"

  tasks:
    - name: Check required deployment tools
      ansible.builtin.command: "{{ item.command }}"
      loop:
        - command: kubectl version --client
        - command: aws --version
      changed_when: false

    - name: Require the audio bucket name
      ansible.builtin.assert:
        that:
          - audio_bucket_name | length > 0
        fail_msg: "Set AUDIO_BUCKET_NAME to the Terraform audio bucket output"

    - name: Sync audio from the application repository to S3
      ansible.builtin.command:
        argv:
          - "{{ audio_sync_script }}"
          - "{{ app_repo_url }}"
          - "{{ audio_bucket_name }}"
      environment:
        AWS_DEFAULT_REGION: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('eu-central-1', true) }}"
      when: audio_bucket_name | length > 0
      changed_when: true

    - name: Apply Kubernetes manifests
      ansible.builtin.command: kubectl apply -f {{ item }}
      loop:
        - "{{ kubernetes_dir }}/namespace.yaml"
        - "{{ kubernetes_dir }}/deployment.yaml"
        - "{{ kubernetes_dir }}/service.yaml"
        - "{{ kubernetes_dir }}/ingress.yaml"
        - "{{ kubernetes_dir }}/pdb.yaml"
      changed_when: true

    - name: Wait for the application pod
      ansible.builtin.command:
        kubectl wait --namespace weather-demo --for=condition=ready pod
        -l app=weather-app --timeout=180s
      changed_when: false

    - name: Clone application source for non-audio pod content
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "/tmp/ai-nginx"
        version: HEAD
        depth: 1

    - name: Find application pods
      ansible.builtin.command: kubectl get pods -n weather-demo -l app=weather-app -o jsonpath={range .items[*]}{.metadata.name}{"\\n"}{end}
      register: application_pods
      changed_when: false

    - name: Copy AI_Nginx non-audio files into every application pod
      ansible.builtin.shell: |
        while IFS= read -r pod; do
          while IFS= read -r -d '' file; do
            relative="${file#/tmp/ai-nginx/html/}"
            target_dir="/usr/share/nginx/html/$(dirname "$relative")"
            kubectl exec -n weather-demo "$pod" -- mkdir -p "$target_dir"
            kubectl cp "$file" "weather-demo/${pod}:$target_dir/$(basename "$relative")"
          done < <(find /tmp/ai-nginx/html -type f ! -path '/tmp/ai-nginx/html/audio/*' -print0)
        done <<< "{{ application_pods.stdout }}"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Remove local application checkout
      ansible.builtin.file:
        path: "/tmp/ai-nginx"
        state: absent
