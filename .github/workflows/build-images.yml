name: Build Images (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        type: choice
        options:
          - feature/kubernetes-eks
          - feature/eks-s3-audio

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image name
        id: image
        run: |
          if [[ "${{ inputs.branch }}" == "feature/kubernetes-eks" ]]; then
            echo "name=ghcr.io/izanar/image-test-env-kubernetes:latest" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/izanar/image-test-env-s3:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
