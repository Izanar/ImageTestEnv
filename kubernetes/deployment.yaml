apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather-demo
  labels:
    app: weather-app
    app.kubernetes.io/name: weather-app
    app.kubernetes.io/part-of: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      serviceAccountName: weather-app
      volumes:
        - name: audio
          emptyDir: {}
      initContainers:
        - name: sync-audio
          image: amazon/aws-cli:2.17.49
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /audio &&
              aws s3 sync s3://${AUDIO_BUCKET}/audio /audio --only-show-errors
          envFrom:
            - configMapRef:
                name: audio-config
          volumeMounts:
            - name: audio
              mountPath: /audio
      containers:
        - name: weather-app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: audio
              mountPath: /usr/share/nginx/html/audio
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
