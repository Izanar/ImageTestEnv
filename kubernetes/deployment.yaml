apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather-demo
  labels:
    app: weather-app
    app.kubernetes.io/name: weather-app
    app.kubernetes.io/part-of: devops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: weather-app
      volumes:
        - name: nginx-config
          configMap:
            name: audio-config
      containers:
        - name: weather-app
          image: ghcr.io/izanar/image-test-env-s3:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
