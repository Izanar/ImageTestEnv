apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather-demo
  labels:
    app: weather-app
    app.kubernetes.io/name: weather-app
    app.kubernetes.io/part-of: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
        - name: weather-app
          image: ghcr.io/izanar/image-test-env-kubernetes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
